<title>Training Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky bar (title, window, tabs) over a single column; Overview is two
   person columns side by side for screen-sharing, detail tabs stack cards. */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --surface-2: #eaedf1;
  --ink: #101720;
  --ink-2: #48525e;
  --muted: #7f8995;
  --line: #dde2e8;
  --axis: #c3c9d1;
  --p1: #2a78d6;
  --p2: #eb6834;
  --p1-wash: rgba(42,120,214,.10);
  --p2-wash: rgba(235,104,52,.10);
  --good: #0ca30c;
  --good-ink: #0b6b14;
  --warn: #c98500;
  --bad: #d03b3b;
  --btn: #101720;
  --btn-ink: #ffffff;
  --focus: #2a78d6;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
  --fs: 15px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1014; --surface: #161a20; --surface-2: #1e242c; --ink: #f1f4f7; --ink-2: #b6bfca;
    --muted: #7e8894; --line: #2a3139; --axis: #3a424c; --p1: #3987e5; --p2: #d95926;
    --p1-wash: rgba(57,135,229,.16); --p2-wash: rgba(217,89,38,.16);
    --good: #0ca30c; --good-ink: #39c45a; --warn: #fab219; --bad: #e66767; --btn: #f1f4f7; --btn-ink: #0d1014; --focus: #6aa8f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1014; --surface: #161a20; --surface-2: #1e242c; --ink: #f1f4f7; --ink-2: #b6bfca;
  --muted: #7e8894; --line: #2a3139; --axis: #3a424c; --p1: #3987e5; --p2: #d95926;
  --p1-wash: rgba(57,135,229,.16); --p2-wash: rgba(217,89,38,.16);
  --good: #0ca30c; --good-ink: #39c45a; --warn: #fab219; --bad: #e66767; --btn: #f1f4f7; --btn-ink: #0d1014; --focus: #6aa8f0;
  color-scheme: dark;
}
:root.big { --fs: 18px; }
html { font-size: var(--fs); }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1240px; margin: 0 auto; padding: 12px 20px 0; display: grid; gap: 10px; }
.bar-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--font-body); font-weight: 500; font-size: .8rem; letter-spacing: 0; text-transform: none; color: var(--muted); }
.bar-ctl { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, input[type=text], input[type=number], input[type=date], input[type=time], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
textarea { width: 100%; min-height: 140px; resize: vertical; line-height: 1.4; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 9px 14px 11px; color: var(--ink-2); font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab:hover { color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

main { max-width: 1240px; margin: 0 auto; padding-block: 20px 60px; padding-inline: 20px; display: grid; gap: 20px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.primary:hover { opacity: .9; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 4px 9px; font-size: .85rem; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.notice { border: 1px dashed var(--axis); border-radius: var(--r); padding: 14px 16px; color: var(--ink-2); background: var(--surface); }
.notice b { color: var(--ink); }

.window-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.window-line h2 { font-size: 1.6rem; }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 20px; }
.pcol { display: grid; gap: 14px; align-content: start; min-width: 0; }
.phead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.phead h2 { font-size: 1.7rem; }
.phead .dot { width: 12px; height: 12px; }
.fresh { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tiles.four { grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 10px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.tile .lab { font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.tile .val { font-family: var(--font-display); font-weight: 600; font-size: 2.3rem; line-height: 1.05; }
.tile .val small { font-size: 1rem; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.tile .sub { font-size: .84rem; color: var(--ink-2); min-height: 1.2em; }
.tile.empty .val { color: var(--muted); font-size: 1.2rem; font-family: var(--font-body); font-weight: 500; padding-block: 10px 4px; }
.spark { height: 30px; margin-top: 4px; }
.pill { font-size: .72rem; font-weight: 700; letter-spacing: .03em; text-transform: none; padding: 1px 7px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
.pill.good { color: var(--good-ink); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.warn { color: var(--ink); background: color-mix(in srgb, var(--warn) 22%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card h3 { font-size: 1.25rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }

.commit { display: grid; gap: 0; }
.crow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); }
.crow:first-child { border-top: 0; }
.crow .t { font-weight: 600; }
.crow .d { font-size: .84rem; color: var(--ink-2); }
.st { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .85rem; font-weight: 700; border: 0; cursor: pointer; padding: 0; }
.st.met { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good-ink); }
.st.partial { background: color-mix(in srgb, var(--warn) 24%, transparent); color: var(--ink); }
.st.missed { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.st.nodata, .st.manual, .st.skip { background: var(--surface-2); color: var(--muted); }
.st:disabled { cursor: default; }
.crow .tag { font-size: .72rem; color: var(--muted); white-space: nowrap; padding-top: 3px; }

.chart { position: relative; width: 100%; min-height: 60px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .tgt-label { fill: var(--ink-2); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.box { width: 10px; height: 10px; border-radius: 2px; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.14); border-radius: 8px; padding: 7px 10px; font-size: .82rem; max-width: 260px; }
#tip b { font-size: .95rem; display: block; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mini { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.mini .chip { font-size: .72rem; }
.chip.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good-ink); }

.goals { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.form { display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > label { display: grid; gap: 3px; font-size: .8rem; color: var(--ink-2); font-weight: 600; }
.drop { border: 2px dashed var(--axis); border-radius: var(--r); padding: 18px; text-align: center; color: var(--ink-2); cursor: pointer; }
.drop.over { border-color: var(--focus); background: var(--p1-wash); }
.status { font-size: .88rem; color: var(--ink-2); min-height: 1.3em; }
.status.err { color: var(--bad); }
.status.ok { color: var(--good-ink); }

.ask-box { display: flex; gap: 8px; }
.ask-box input { flex: 1; font-size: 1.05rem; padding: 10px 12px; }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; }
.suggest button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: .85rem; cursor: pointer; color: var(--ink-2); }
.suggest button:hover { color: var(--ink); border-color: var(--axis); }
.answer { display: grid; gap: 10px; }
.answer .q { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
.answer .a { white-space: pre-wrap; font-size: 1.02rem; }
.answer .a.thinking { color: var(--muted); }
.answer .meta { font-size: .78rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

@media (max-width: 560px) {
  .bar-in, main { padding-inline: 16px; }
  .tile .val { font-size: 1.9rem; }
  .bar-ctl { margin-left: 0; }
  .brand { font-size: 1.15rem; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .tile, .card { transition: border-color .15s; }
}
</style>

<div class="bar">
  <div class="bar-in">
    <div class="bar-top">
      <div class="brand">Training Check-in <small id="sync-note">Loading…</small></div>
      <div class="bar-ctl">
        <label for="win" class="muted" style="font-size:.85rem">Window</label>
        <select id="win" aria-label="Time window"></select>
        <button class="btn small" id="bigger" type="button" aria-pressed="false" title="Larger text for screen sharing">Larger text</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  </div>
</div>
<main id="main" aria-live="polite"></main>
<div id="tip" hidden></div>

<script src="core.js"></script>
<script>
"use strict";
const C = window.Core;

// ------------------------------------------------------------------ state
const S = {
  db: null, sample: null, canWrite: null, ready: false,
  tab: "overview", winKey: "since",
  people: {}, days: {}, workouts: {}, marks: {}, coverage: {}, checkins: [],
  tabNodes: {}, asks: [], asker: null,
};
try { S.tab = localStorage.getItem("tab") || "overview"; S.asker = localStorage.getItem("asker"); if (localStorage.getItem("big") === "1") document.documentElement.classList.add("big"); } catch (_) {}

// ---------------------------------------------------------------- helpers
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const NS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const c of kids) if (c != null) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const fmtInt = (n) => (n == null || isNaN(n) ? "—" : Math.round(n).toLocaleString("en-US"));
const fmt1 = (n) => (n == null || isNaN(n) ? "—" : (Math.round(n * 10) / 10).toFixed(1));
const fmtK = (n) => (n == null ? "—" : n >= 10000 ? (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + "k" : fmtInt(n));
const fmtSigned = (n, d = 1) => (n == null || isNaN(n) ? "—" : (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n).toFixed(d));
const fmtDur = (sec) => { sec = Math.round(sec); const m = Math.floor(sec / 60), r = sec % 60; return `${m}:${String(r).padStart(2, "0")}`; };
const today = () => C.todayLocal();
const store = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };

function personIds() {
  const ids = new Set(Object.keys(S.people));
  for (const src of [S.days, S.workouts, S.marks]) for (const k of Object.keys(src)) ids.add(k);
  return [...ids].sort((a, b) => ((S.people[a] || {}).order ?? 99) - ((S.people[b] || {}).order ?? 99) || a.localeCompare(b));
}
function personColor(id) {
  const slot = (S.people[id] || {}).color || (personIds().indexOf(id) % 2) + 1;
  return slot === 2 ? "var(--p2)" : "var(--p1)";
}
function personName(id) { return (S.people[id] || {}).name || id; }
function model(id) {
  const p = S.people[id] || {};
  return { id, ...p, targets: p.targets || {}, days: S.days[id] || {}, workouts: S.workouts[id] || [], coverage: S.coverage[id] || {}, marks: S.marks[id] || [] };
}

// --------------------------------------------------------------- windows
function windowOptions() {
  const t = today(), tomorrow = C.addDays(t, 1);
  const cis = S.checkins.filter((c) => c.date <= t);
  const out = [];
  if (cis.length) {
    const last = cis[cis.length - 1];
    out.push({ key: "since", label: `Since last check-in (${C.fmtDate(last.date)})`, from: last.date, to: tomorrow, checkin: last });
  }
  out.push({ key: "7", label: "Last 7 days", from: C.addDays(t, -6), to: tomorrow });
  out.push({ key: "28", label: "Last 4 weeks", from: C.addDays(t, -27), to: tomorrow });
  for (let i = cis.length - 2; i >= 0; i--) {
    out.push({ key: "ci:" + cis[i].date, label: `${C.fmtDate(cis[i].date)} → ${C.fmtDate(cis[i + 1].date)} check-in week`, from: cis[i].date, to: cis[i + 1].date, checkin: cis[i] });
  }
  return out;
}
function currentWindow() {
  const opts = windowOptions();
  return opts.find((o) => o.key === S.winKey) || opts[0];
}
function renderWindowSelect() {
  const sel = document.getElementById("win");
  const opts = windowOptions();
  const cur = currentWindow();
  sel.replaceChildren(...opts.map((o) => h("option", { value: o.key, selected: o.key === cur.key }, o.label)));
}
document.getElementById("win").addEventListener("change", (e) => { S.winKey = e.target.value; render(); });
document.getElementById("bigger").addEventListener("click", (e) => {
  const on = document.documentElement.classList.toggle("big");
  e.currentTarget.setAttribute("aria-pressed", on);
  store("big", on ? "1" : "0");
  requestAnimationFrame(drawCharts);
});

// ------------------------------------------------------------------- tabs
function tabList() {
  return [
    { id: "overview", label: "Overview" },
    ...personIds().map((id) => ({ id: "p:" + id, label: personName(id), color: personColor(id) })),
    { id: "ask", label: "Ask" },
    { id: "checkins", label: "Check-ins" },
    { id: "data", label: "Add data" },
  ];
}
function renderTabs() {
  const nav = document.getElementById("tabs");
  const tabs = tabList();
  if (!tabs.some((t) => t.id === S.tab)) S.tab = "overview";
  nav.replaceChildren(...tabs.map((t) => h("button", {
    class: "tab", role: "tab", type: "button", "aria-selected": t.id === S.tab ? "true" : "false",
    onclick: () => { S.tab = t.id; store("tab", t.id); render(); window.scrollTo({ top: 0 }); },
  }, t.color ? h("span", { class: "dot", style: `background:${t.color}` }) : null, t.label)));
}

// ----------------------------------------------------------------- charts
const charts = new Map();
const tip = document.getElementById("tip");
function showTip(evt, nodes) {
  tip.replaceChildren(...nodes);
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = evt.clientX + 14, y = evt.clientY + 14;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - 14;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.hidden = true; };

function chartBox(spec) {
  const el = h("div", { class: "chart", role: "img", "aria-label": spec.aria || spec.title || "Chart" });
  charts.set(el, spec);
  return el;
}
function drawCharts() {
  for (const [el, spec] of charts) {
    if (!el.isConnected) { charts.delete(el); continue; }
    el.replaceChildren();
    const w = Math.max(240, el.clientWidth || 600);
    if (spec.type === "bar") drawBar(el, spec, w);
    else if (spec.type === "line") drawLine(el, spec, w);
    else if (spec.type === "spark") drawSpark(el, spec, w);
  }
}
let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(drawCharts, 120); });

function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}
/** Bars: spec {data:[{label, value, tip?, dim?}], target?, targetLabel?, color, fmt, height} */
function drawBar(el, spec, W) {
  const H = spec.height || 170, ml = 40, mr = spec.target ? 54 : 8, mt = 10, mb = 22;
  const pw = W - ml - mr, ph = H - mt - mb;
  const vals = spec.data.map((d) => d.value).filter((v) => v != null);
  const top = Math.max(...vals, spec.target || 0, spec.minMax || 0);
  const yMax = spec.integer ? Math.max(2, Math.ceil((top * 1.1) / 2) * 2) : niceMax(top * 1.05);
  const y = (v) => mt + ph - (v / yMax) * ph;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H });
  const fmt = spec.fmt || fmtInt;
  for (const t of [0, yMax / 2, yMax]) {
    svg.append(s("line", { x1: ml, x2: ml + pw, y1: y(t), y2: y(t), stroke: t === 0 ? "var(--axis)" : "var(--line)", "stroke-width": 1 }));
    svg.append(s("text", { x: ml - 6, y: y(t) + 4, "text-anchor": "end" }, spec.tickFmt ? spec.tickFmt(t) : fmtK(t)));
  }
  const n = spec.data.length, band = pw / n, bw = Math.min(24, Math.max(3, band * 0.62));
  const every = Math.ceil(n / Math.max(1, Math.floor(pw / 46)));
  spec.data.forEach((d, i) => {
    const cx = ml + band * i + band / 2;
    const g = s("g", { tabindex: 0 });
    if (d.value != null && d.value > 0) {
      const top = y(d.value), bot = y(0), r = Math.min(4, bw / 2, bot - top);
      const x0 = cx - bw / 2, x1 = cx + bw / 2;
      g.append(s("path", { d: `M${x0},${bot}V${top + r}Q${x0},${top} ${x0 + r},${top}H${x1 - r}Q${x1},${top} ${x1},${top + r}V${bot}Z`, fill: d.color || spec.color, opacity: d.dim ? 0.38 : 1 }));
    } else if (d.value == null) {

// -------------------------------------------------------- tiles & pieces

const PILL = {

  warn: (t) => ({ cls: "warn", icon: "◐", text: t }),

function freshness(m) {

  const wLast = c.workouts || (m.workouts.length ? m.workouts[m.workouts.length - 1].date : null);
  const items = [["Workouts", wLast], ["Steps", last("steps")], ["Food", last("calories")], ["Weight", last("weight")]];
  return h("div", { class: "fresh" }, items.map(([k, d]) => h("span", { class: "chip", title: d ? `${k} data through ${d}` : `No ${k.toLowerCase()} data yet` }, d ? `${k} → ${C.fmtDate(d)}` : `${k}: none yet`)));
}

function kpiTiles(m, win, opts = {}) {
  const sum = C.windowSummary(m, win.from, win.to);
  const t = m.targets;
  const weeks = sum.nDays / 7;
  const tiles = [];
  const end = C.addDays(win.to, -1);

  // Workouts
  if (!sum.workouts.hasSource) tiles.push(tile({ label: "Workouts", empty: "No workout data yet", sub: "Add a Hevy export or workout notes" }));
  else {
    const target = t.workouts_per_week ? Math.round(t.workouts_per_week * weeks) : null;
    const wb = C.weeklyBuckets(m, end, 8, m.week_starts ?? 1);
    const bits = [];
    if (target) bits.push(`target ${target}`);
    if (sum.workouts.count) bits.push(`${sum.workouts.legsFirst} legs-first`);
    if (t.cardio_per_week) bits.push(`${sum.workouts.cardio} conditioning`);
    let pill = null;
    if (target) pill = sum.workouts.count >= target ? PILL.good("on target") : null;
    tiles.push(tile({ label: "Workouts", value: String(sum.workouts.count), unit: sum.nDays > 8 ? `in ${sum.nDays} days` : "this week", sub: bits.join(" · "), pill, spark: { values: wb.map((b) => b.workouts), color: personColor(m.id), bars: true, target: t.workouts_per_week } }));
  }
  // Steps
  if (!sum.steps.n) tiles.push(tile({ label: "Steps / day", empty: "No step data yet", sub: "Apple Health shortcut or screenshot" }));
  else {
    const tg = t.steps_avg_min;
    const pill = tg ? (sum.steps.avg >= tg ? PILL.good("above " + fmtK(tg)) : sum.steps.avg >= tg * 0.85 ? PILL.warn("near " + fmtK(tg)) : PILL.bad("under " + fmtK(tg))) : null;

    tiles.push(tile({ label: "Steps / day", value: fmtInt(sum.steps.avg), sub: `${sum.steps.n} of ${sum.nDays} days with data`, pill, spark: { values: sv, color: personColor(m.id), bars: true, target: tg } }));
  }
  // Calories
  if (!sum.calories.n) tiles.push(tile({ label: "Calories / day", empty: "No food log yet", sub: "MacroFactor / MyFitnessPal via Health" }));
  else {
    const bits = [`${sum.calories.n} of ${Math.min(sum.nDays, sum.calories.knownDays || sum.nDays)} days logged`];
    let pill = null;
    if (t.calories_daily_max) {
      bits.push(`${sum.calories.underMax ?? 0} under ${fmtInt(t.calories_daily_max)}`);
      pill = (sum.calories.underMax ?? 0) === sum.calories.n ? PILL.good("all under") : null;
    } else if (t.calories_target) {
      bits.push(`target ${fmtInt(t.calories_target)}`);

    tiles.push(tile({ label: "Calories / day", value: fmtInt(sum.calories.avg), unit: "kcal", sub: bits.join(" · "), pill, spark: { values: cv, color: personColor(m.id), bars: true, target: t.calories_daily_max || t.calories_target } }));
  }

  else {
    const tw = C.trendWeight(m.days, end).filter((p) => p.date >= C.addDays(win.to, -56));

    if (sum.weight.rate != null) bits.push(`${fmtSigned(sum.weight.rate)} lb/wk`);

  }

let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload = () => res(window.XLSX); sc.onerror = () => rej(new Error("Couldn't load the spreadsheet reader")); document.head.append(sc); });

}
async function readTables(file) {
  const name = file.name.toLowerCase();
  if (/\.(xlsx|xls)$/.test(name)) {
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), { type: "array", cellDates: true });
    return wb.SheetNames.map((sn) => ({ name: sn, objects: X.utils.sheet_to_json(wb.Sheets[sn], { defval: "", raw: true }) })).filter((t) => t.objects.length);
  }
  const text = await file.text();
  if (/\.json$/.test(name)) {
    const j = JSON.parse(text);
    const arr = Array.isArray(j) ? j : j.data || j.rows || j.days || [];
    return [{ name: file.name, objects: arr }];
  }
  return [{ name: file.name, objects: C.rowsToObjects(C.parseCSV(text)) }];
}

/** Merge parsed data into month-bucket documents. */
async function saveDays(pid, days, src, through) {
  const buckets = C.bucketDays(days, src);
  for (const [month, recs] of Object.entries(buckets)) {
    const ref = S.db.doc(`days/${pid}_${month}`);
    const ex = await ref.get();
    const cur = ex.exists ? (ex.data().d || {}) : {};
    const d = { ...cur };
    for (const [date, rec] of Object.entries(recs)) d[date] = { ...(cur[date] || {}), ...rec, src: { ...((cur[date] || {}).src || {}), ...(rec.src || {}) } };
    await ref.set({ person: pid, month, d });
  }
  const metrics = [...new Set(Object.values(days).flatMap((r) => Object.keys(r)))];
  await bumpCoverage(pid, Object.fromEntries(metrics.map((m) => [m, through || Object.keys(days).sort().pop()])), src);
}
async function saveWorkouts(pid, workouts, through, src) {
  const buckets = C.bucketWorkouts(workouts);
  for (const [month, items] of Object.entries(buckets)) {
    const ref = S.db.doc(`workouts/${pid}_${month}`);
    const ex = await ref.get();
    const cur = ex.exists ? (ex.data().items || {}) : {};
    await ref.set({ person: pid, month, items: { ...cur, ...JSON.parse(JSON.stringify(items)) } });
  }
  await bumpCoverage(pid, { workouts: through || workouts.map((w) => w.date).sort().pop() }, src);
}
async function saveMarks(pid, marks) {
  const ref = S.db.doc("marks/" + pid);
  const ex = await ref.get();
  const items = ex.exists ? { ...(ex.data().items || {}) } : {};
  for (const k of marks) items[`${k.metric}_${k.date}`] = k;
  await ref.set({ person: pid, items });
}
async function bumpCoverage(pid, upd, src) {
  const ref = S.db.doc("coverage/" + pid);
  const ex = await ref.get();
  const cur = ex.exists ? { ...ex.data() } : { person: pid };
  for (const [k, v] of Object.entries(upd)) if (v && (!cur[k] || v > cur[k])) cur[k] = v;
  cur.last_import = { at: new Date().toISOString(), source: src || "import" };
  await ref.set(cur);
}

  const cov = h("div", { class: "tablewrap" });
  out.append(h("div", { class: "card" }, h("header", null, h("h3", null, "What's loaded")), cov,
    h("p", { class: "muted", style: "margin:0;font-size:.84rem" }, "Before each call: Yav exports Hevy and MacroFactor (or runs the Health shortcut); Abdul pastes the week's notes and runs the Health shortcut or adds screenshots. Anything not added simply shows as no data.")));

  out.refresh = () => {
    for (const sel of [fileWho, aiWho, qWho]) sel.refresh();
    const rows = personIds().map((id) => {
      const m = model(id);
      const cell = (metric) => { const ds = Object.keys(m.days).filter((d) => m.days[d][metric] != null).sort(); return ds.length ? `${ds.length} days · to ${C.fmtDate(ds[ds.length - 1])}` : "—"; };
      const li = (S.coverage[id] || {}).last_import;
      return h("tr", null, h("td", null, h("span", { class: "dot", style: `background:${personColor(id)};margin-right:6px` }), personName(id)),
        h("td", null, m.workouts.length ? `${m.workouts.length} · to ${C.fmtDate(m.workouts[m.workouts.length - 1].date)}` : "—"),
        h("td", null, cell("steps")), h("td", null, cell("calories")), h("td", null, cell("weight")), h("td", null, (m.marks || []).length || "—"),
        h("td", { class: "muted" }, li ? `${C.fmtDate(C.parseDateTime(li.at).date)} · ${li.source}` : "—"));
    });
    cov.replaceChildren(h("table", null, h("thead", null, h("tr", null, ["Person", "Workouts", "Steps", "Food", "Weight", "Benchmarks", "Last import"].map((x) => h("th", null, x)))), h("tbody", null, rows)));
    readBtn.disabled = !S.sample;
  };
  return out;
}

// ----------------------------------------------------------------- render
let renderQueued = false;
function render() {
  renderTabs();
  renderWindowSelect();
  const main = document.getElementById("main");
  let kids;
  if (S.tab === "overview") kids = viewOverview();
  else if (S.tab.startsWith("p:")) kids = viewPerson(S.tab.slice(2));
  else if (S.tab === "ask") kids = viewAsk();
  else if (S.tab === "checkins") kids = viewCheckins();
  else kids = viewData();
  main.replaceChildren(...kids);
  requestAnimationFrame(drawCharts);
}
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    // Keep forms intact: tabs with inputs only refresh their data parts.
    if (S.tab === "ask" || S.tab === "data" || S.tab === "checkins") { renderTabs(); renderWindowSelect(); S.tabNodes[S.tab] && S.tabNodes[S.tab].refresh(); requestAnimationFrame(drawCharts); }
    else render();
  });
}

// --------------------------------------------------------------- loading
function subscribe(name, apply) {
  S.db.collection(name).onSnapshot((snap) => { apply(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); S.ready = true; syncNote(); queueRender(); },
    (e) => { flash(`Couldn't load ${name} (${e.code}).`); });
}
function syncNote() {
  flash(S.canWrite === false ? "View only" : "Shared · saved in Claude");
}
async function boot() {
  render();
  const claude = window.claude;
  if (!claude || !claude.use) { S.ready = true; flash("Not connected"); render(); return; }
  claude.use("sample").then((fn) => { S.sample = fn; queueRender(); }).catch(() => {});
  const [db, user] = await Promise.all([claude.use("db").catch(() => null), claude.use("user").catch(() => null)]);
  S.db = db;
  if (!db) { S.ready = true; flash("Not connected"); render(); return; }
  if (user) { try { S.canWrite = await user.can("data.write"); } catch (_) {} }
  subscribe("people", (docs) => { S.people = Object.fromEntries(docs.map((d) => [d.id, d])); });
  subscribe("days", (docs) => {
    const out = {};
    for (const d of docs) { const p = out[d.person] || (out[d.person] = {}); for (const [date, rec] of Object.entries(d.d || {})) { const { src, ...vals } = rec; p[date] = vals; } }
    S.days = out;
  });
  subscribe("workouts", (docs) => {
    const out = {};
    for (const d of docs) { const arr = out[d.person] || (out[d.person] = []); for (const w of Object.values(d.items || {})) arr.push(w); }
    for (const arr of Object.values(out)) arr.sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
    S.workouts = out;
  });
  subscribe("marks", (docs) => {
    const out = {};
    for (const d of docs) out[d.person || d.id] = Object.values(d.items || {}).sort((a, b) => a.date.localeCompare(b.date));
    S.marks = out;
  });
  subscribe("coverage", (docs) => { S.coverage = Object.fromEntries(docs.map((d) => [d.person || d.id, d])); });
  subscribe("checkins", (docs) => { S.checkins = docs.filter((d) => d.date).sort((a, b) => a.date.localeCompare(b.date)); });
}
boot();
</script>
